name: incidentpilot

x-app: &app
  init: true
  restart: "no"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [application]
  mem_limit: 512m
  cpus: 1.0

x-http-health: &http-health
  test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: incidentpilot
      POSTGRES_PASSWORD: ${INCIDENTPILOT_POSTGRES_ADMIN_PASSWORD:?set a local admin password}
      INCIDENTPILOT_DB_PASSWORD: ${INCIDENTPILOT_DB_PASSWORD:?set a local application password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/001-app-role.sql:/docker-entrypoint-initdb.d/001-app-role.sql:ro
    networks: [application]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d incidentpilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  redis:
    image: redis:7.4-bookworm
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    networks: [application]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  migrate:
    <<: *app
    build:
      context: .
      args: {SERVICE_EXTRAS: data}
    command: [alembic, upgrade, head]
    environment: &data-env
      INCIDENTPILOT_SERVICE_NAME: data
      INCIDENTPILOT_DATABASE_URL: postgresql+psycopg://incidentpilot:${INCIDENTPILOT_DB_PASSWORD:?set a local application password}@postgres:5432/incidentpilot
      INCIDENTPILOT_INTERNAL_TOKEN: ${INCIDENTPILOT_INTERNAL_TOKEN:?set a local internal token}
    depends_on:
      postgres: {condition: service_healthy}

  data:
    <<: *app
    networks: [application, evidence]
    build:
      context: .
      args: {SERVICE_EXTRAS: "api,data,observability"}
    command: [uvicorn, incidentpilot.services.data.app:create_app, --factory, --host, 0.0.0.0, --port, "8000", --no-access-log]
    environment:
      <<: *data-env
      INCIDENTPILOT_TELEMETRY_ENABLED: "true"
      INCIDENTPILOT_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck: *http-health

  auth:
    <<: *app
    networks: [application, evidence]
    build:
      context: .
      args: {SERVICE_EXTRAS: "api,observability"}
    command: [uvicorn, incidentpilot.services.auth.app:create_app, --factory, --host, 0.0.0.0, --port, "8000", --no-access-log]
    environment:
      INCIDENTPILOT_SERVICE_NAME: auth
      INCIDENTPILOT_SANDBOX_AUTH_TOKEN: ${INCIDENTPILOT_SANDBOX_AUTH_TOKEN:?set a local sandbox auth token}
      INCIDENTPILOT_TELEMETRY_ENABLED: "true"
      INCIDENTPILOT_OTLP_ENDPOINT: http://otel-collector:4318
    healthcheck: *http-health

  gateway:
    <<: *app
    build:
      context: .
      args: {SERVICE_EXTRAS: "api,worker,observability"}
    command: [uvicorn, incidentpilot.services.gateway.app:create_app, --factory, --host, 0.0.0.0, --port, "8000", --no-access-log]
    ports: ["127.0.0.1:${INCIDENTPILOT_GATEWAY_PORT:-8000}:8000"]
    networks: [application, evidence, edge]
    environment:
      INCIDENTPILOT_SERVICE_NAME: gateway
      INCIDENTPILOT_AUTH_URL: http://auth:8000
      INCIDENTPILOT_WORKER_METRICS_URL: http://worker:9100
      INCIDENTPILOT_DATA_URL: http://data:8000
      INCIDENTPILOT_BROKER_URL: redis://redis:6379/0
      INCIDENTPILOT_INTERNAL_TOKEN: ${INCIDENTPILOT_INTERNAL_TOKEN:?set a local internal token}
      INCIDENTPILOT_HTTP_TIMEOUT: "3"
      INCIDENTPILOT_TELEMETRY_ENABLED: "true"
      INCIDENTPILOT_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      auth: {condition: service_healthy}
      data: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck: *http-health

  worker:
    <<: *app
    networks: [application, evidence]
    build:
      context: .
      args: {SERVICE_EXTRAS: "api,worker,observability"}
    # Solo keeps this single-worker sandbox's in-process Prometheus registry coherent.
    command: [celery, -A, incidentpilot.services.worker.app:app, worker, --loglevel=INFO, --pool=solo, --concurrency=1, --hostname=worker@incidentpilot]
    environment:
      INCIDENTPILOT_SERVICE_NAME: worker
      INCIDENTPILOT_DATA_URL: http://data:8000
      INCIDENTPILOT_BROKER_URL: redis://redis:6379/0
      INCIDENTPILOT_INTERNAL_TOKEN: ${INCIDENTPILOT_INTERNAL_TOKEN:?set a local internal token}
      INCIDENTPILOT_WORKER_RETRY_LIMIT: "3"
      INCIDENTPILOT_WORKER_RETRY_DELAY: "2"
      INCIDENTPILOT_TELEMETRY_ENABLED: "true"
      INCIDENTPILOT_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      data: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=4)"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 20s

  control-plane:
    <<: *app
    build:
      context: .
      args: {SERVICE_EXTRAS: "api,observability"}
    command: [uvicorn, incidentpilot.services.control_plane.app:create_app, --factory, --host, 0.0.0.0, --port, "8000", --no-access-log]
    ports: ["127.0.0.1:${INCIDENTPILOT_CONTROL_PLANE_PORT:-8001}:8000"]
    networks: [evidence, edge]
    environment:
      INCIDENTPILOT_SERVICE_NAME: control-plane
      INCIDENTPILOT_PROMETHEUS_URL: http://prometheus:9090
      INCIDENTPILOT_LOKI_URL: http://loki:3100
      INCIDENTPILOT_TEMPO_URL: http://tempo:3200
      INCIDENTPILOT_DATA_URL: http://data:8000
      INCIDENTPILOT_GATEWAY_URL: http://gateway:8000
      INCIDENTPILOT_AUTH_URL: http://auth:8000
      INCIDENTPILOT_INTERNAL_TOKEN: ${INCIDENTPILOT_INTERNAL_TOKEN:?set a local internal token}
      INCIDENTPILOT_HTTP_TIMEOUT: "3"
      INCIDENTPILOT_TELEMETRY_ENABLED: "true"
      INCIDENTPILOT_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      gateway: {condition: service_healthy}
      prometheus: {condition: service_started}
      loki: {condition: service_started}
      tempo: {condition: service_started}
    healthcheck: *http-health

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [application, evidence]
    depends_on:
      loki: {condition: service_started}
      tempo: {condition: service_started}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m

  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d, --storage.tsdb.retention.size=512MB]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [application, evidence]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m

  loki:
    image: grafana/loki:3.5.3
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./infra/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks: [application, evidence]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m

  tempo:
    image: grafana/tempo:2.8.2
    command: [-config.file=/etc/tempo/config.yaml]
    volumes:
      - ./infra/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    networks: [application, evidence]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m

  grafana:
    image: grafana/grafana:12.1.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${INCIDENTPILOT_GRAFANA_ADMIN_USER:-sandbox}
      GF_SECURITY_ADMIN_PASSWORD: ${INCIDENTPILOT_GRAFANA_ADMIN_PASSWORD:?set a local Grafana password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [application, edge]
    depends_on:
      prometheus: {condition: service_started}
      loki: {condition: service_started}
      tempo: {condition: service_started}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m

networks:
  application:
    internal: true
  evidence:
    internal: true
  edge:
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
