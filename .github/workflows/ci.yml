name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes --requirement requirements-dev.lock
      - run: python -m pip install --no-deps --editable .
      - run: python -m pytest -m "not integration"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pip check
      - run: git diff --check

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      INCIDENTPILOT_POSTGRES_ADMIN_PASSWORD: 0123456789abcdef0123456789abcdef
      INCIDENTPILOT_DB_PASSWORD: 123456789abcdef0123456789abcdef0
      INCIDENTPILOT_INTERNAL_TOKEN: 23456789abcdef0123456789abcdef01
      INCIDENTPILOT_SANDBOX_AUTH_TOKEN: 3456789abcdef0123456789abcdef012
      INCIDENTPILOT_GRAFANA_ADMIN_PASSWORD: 456789abcdef0123456789abcdef0123
      INCIDENTPILOT_RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes --requirement requirements-dev.lock
      - run: python -m pip install --no-deps --editable .
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: python -m pytest -m integration --no-cov
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
