[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "incidentpilot"
version = "0.1.0"
description = "IncidentPilot monitored sandbox and evidence-driven investigation service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic-settings>=2.7,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1"]
data = ["sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2"]
worker = ["celery[redis]>=5.4,<6", "redis>=5.2,<6"]
observability = [
  "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "opentelemetry-instrumentation-celery>=0.50b0,<1",
  "opentelemetry-instrumentation-httpx>=0.50b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0,<1",
]
dev = [
  "pip-tools>=7.4,<8",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "celery-types>=0.23,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/incidentpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --cov=incidentpilot.shared --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
markers = [
  "integration: requires the explicitly enabled real Docker Compose sandbox",
  "chaos_integration: mutates and restores the explicitly enabled local Compose sandbox",
  "agent_integration: requires the explicitly enabled live incident service",
]

[tool.coverage.run]
branch = true
source = ["incidentpilot.shared"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]
